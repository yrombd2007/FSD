<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline - Inline Block - Block</title>
    <!-- Intrnal CSS  -->

    <style>
        .navbar{
            height: 100px;
            background-color: gold;
            color: black;
            font-size: 50px;
        }
        .parent{
            border: 5px dashed green;
        }
        div[class*="box"]{
            border: 2px dashed red;
            width: 100px;
            height: 100px;
            margin: 20px;
            padding: 20px;
            display: inline;
            display: block;
            display: inline-block;

            
        }
    </style>
</head>
<body>
    <div class="navbar">Navbar</div>
    <div class="parent">
        <div class="box-1">Box-1</div>
        <div class="box-2">Box-2</div>
        <div class="box-3">Box-3</div>
    </div>
    <div class="parent">
        <div class="box-1">Box-1</div>
        <div class="box-2">Box-2</div>
        <div class="box-3">Box-3</div>
    </div>
</body>
</html>
