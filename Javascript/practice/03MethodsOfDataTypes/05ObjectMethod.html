<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Method</title>
</head>

<body>
    <h1>Object Method</h1>

    <script>
        // Object Method


        let myObj = {
            name: "Rohan",
            age: 20,
            isLoggedIn: true
        }


        console.log(myObj);
        console.log(myObj.name);
        console.log(myObj.age);
        console.log(myObj.isLoggedIn);
        console.log(Object.entries(myObj));
        console.log(Object.values(myObj));
        console.log(Object.keys(myObj));


        // let a = {}

        // let b = Object.create(myObj)
        // console.log(a);
        // console.log(b);


    </script>
</body>

</html>
