<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

    function calculator(a, b, operator) {
        let total;

        if (operator == "+") {
            total = a + b;
        }
        else if (operator == "-") {
            total = a - b;
        }
        else if (operator == "*") {
            total = a * b;
        }
        else if (operator == "/") {
            total = a / b;
        }

        console.log(total);
    }

    calculator(2, 4, "+");

    </script>
</body>
</html>
