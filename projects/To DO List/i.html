<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>



    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <style>
        /* #box {
            height: 500px;
            width: 500px;
            margin: 0 auto;
            font-size: 30px;
        } */

        li {
            list-style-position: inside;
        }
    </style>
</head>

<body>

    <div class="col border border-success" id="box">

        <input type="text" name="" id="inpData" class="form-control">

        <button id="btn" class="btn btn-primary" onclick="addTask()">ADD Task</button>

        <div id="disp" class="border border-danger border-3"></div>

    </div>




    <!-- <li>Hello</li> -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script>
        let box = document.getElementById("box")
        let btn = document.getElementById("btn")
        let disp = document.getElementById("disp")
        let inpData = document.getElementById("inpData")
        let arr = []

        function addTask() {

            let todo = inpData.value
            arr.push(todo)
            displayTodo()

        }

        function displayTodo() {
            disp.innerHTML = ""
            arr.forEach((ele, i) => {
                disp.innerHTML
                    += `
                            <div class="row d-flex justify-content-between">
                                <div class="col-8">
                                        <li>${ele}</li>
                                </div>
                                <div class="col-4">
                                    <button  class="btn btn-success" onclick="updateTask(${i})">Update Task</button>
                                    <button  class="btn btn-danger" onclick="deleteTask(this)">Delete Task</button>
                                </div>
                            </div>

                        `
            });
        }


        // Delete a Task 


        function deleteTask(e) {

            console.log(e);
            // console.log(e.target.node);

            e.parentNode.parentNode.remove()
            

        }












    </script>

</body>

</html>
