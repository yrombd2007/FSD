<body>
    <main>
        

    <div class="header"><h1 > <img src="./images/images.png"width="60px" height="60px" >
            TO-DO LIST</h1></div>
    <div class="flex"><input type="text" id="intData" placeholder=" +  Add Here">
    <button id="btn" onclick="addTask()">
        
ADD TASK
    </button>
    <button id="btn1"  onclick="setItem()">Set Task</button>
                     <button id="btn2" onclick="getItem()">Get Task</button><br><br>
    
</div>


<h2 id="heading"> </h2>



    <div id="box">          

    </div>
    <!-- <div id="disp" ></div> -->
  
    </main>



    <script>
        let box=document.getElementById("box")
        let intData=document.getElementById("intData")
        let btn=document.getElementById("btn")

        let arr=[]

     function addTask(){
        let todo=intData.value
        arr.push(todo)
        displayTodo()


}
function displayTodo(){
    box.innerHTML=""
     arr.forEach((ele, i) => {
        box.innerHTML
          += 
          `
        <div  class="task" > 
            <div>

                    ${ele}


                </div>
                <div class="bt"> 
                    <button   class="bt1" onclick="upd(${i})">Update</button>
                    
                
                    <button   class="bt2" onclick="del(${i})">Delete</button>

                </div>
                </div>

 `
   }

);
    
}
function del(i){
    arr.splice(i,1);
    displayTodo();

}

let heading = document.getElementById("heading")

function setItem() {
            console.log(intData.value);

           localStorage.setItem("Data", JSON.stringify(intData.value))

            
        }
 function getItem() {


            
            let a = JSON.parse(localStorage.getItem("Data"))
            heading.innerText = a
            heading.style.color="black"


        }
        




function upd(i) {
            let upd = prompt("Enter updated task:", arr[i]);

            if (upd !== null && upd.trim() !== "") {
                arr[i] = upd.trim();
                displayTodo();
            }
        }


    </script>
