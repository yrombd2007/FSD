<nav id="nav" class="ccs-pillNav" style="z-index: 10;">
  <a class="ccs-pillItem is-active" href="./i.html" target="_self"><i class="fa-solid fa-house fa-lg" style="color: rgb(238, 235, 235);"></i></a>
  <a class="ccs-pillItem" href="./wishlist.html" target="_self"><i class="fa-solid fa-heart fa-lg" style="color: rgb(222, 213, 213);"></i></a>
  <a class="ccs-pillItem" href="./cart.html" target="_self"><i class="fa-solid fa-cart-shopping fa-lg" style="color: rgb(236, 230, 230);"></i></a>
  <a class="ccs-pillItem" href="./profile.html" target="_self"><i class="fa-solid fa-user fa-lg" style="color: rgb(219, 209, 209);"></i></a>

<img src="./images/logo-removebg-preview.png" width="170px" height="150px" style="position: relative;bottom: 60px;left: 150px;">

    <div class="container mt-4">

        <div style="position: relative;bottom: 50px; font-size: 4ch; font-weight: 500;">
             My Wishlist
        <div>
        <br>

        <div id="wishItems" class="d-flex flex-wrap gap-3"></div>

    </div>

    <script>
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        let display = document.getElementById("wishItems");
function showWishlist() {
    display.innerHTML = "";

    wishlist.forEach(function(product, i) {
        display.innerHTML += `
            <div class="card p-3" style="width: 18rem;">
                <img src="${product.image}"
                     style="height: 180px; object-fit: contain;">

                <h5 class="mt-3">${product.title}</h5>
                <h6>Price: $${product.price}</h6>
<br>

                <button class="btn btn-danger" onclick="del(${i})">
Remove from Wishlist
                </button>
                

                    <button class="btn btn-success" onclick="settocart(${i})">
Move to Cart
                </button>
            </div>
        `;
    });
}

function del(i) {
    wishlist.splice(i, 1);
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    showWishlist();
}

      //   function settocart(i) {
      //       let cart = JSON.parse(localStorage.getItem("cart")) || [];

      //  cart.push(wishlist[i]);

      //       localStorage.setItem("cart", JSON.stringify(cart));


      //   }
      
function showWishlist() {
    display.innerHTML = "";

    if (wishlist.length == 0) {
        display.innerHTML = `
            <div class="text-center" id="empty">
                <div >Your Wishlist is Empty</div>
                <a  href="./i.html" class="btn btn-success">
                    Add Items
                </a>
            </div>
        `;
    }
    else {
        wishlist.forEach(function(product, i) {
            display.innerHTML += `
                <div class="card p-3" style="width: 18rem;">
                    <img src="${product.image}"
                         style="height: 180px; object-fit: contain;">

                    <h5 class="mt-3">${product.title}</h5>
                    <h6>Price: $${product.price}</h6>

                    <button class="btn btn-danger" onclick="del(${i})">
                        Remove from Wishlist
                    </button>

                    <button class="btn btn-success" onclick="settocart(${i})">
                        Move to Cart
                    </button>
                </div>
            `;
        });
    }
}

showWishlist();
    </script>
