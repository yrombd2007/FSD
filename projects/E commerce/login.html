<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body style="background-color: rgb(241, 206, 162);">
    
<img src="./images/logo-removebg-preview.png" width="170px" height="150px" style="position: relative;left: 200px;">
    
    <form style="margin-top: 80px;margin-left: 500px; font-size: 2ch;position: relative;bottom: 100px;">
        <h1 style="color: rgb(60, 60, 238);"> <i class="fa-solid fa-user fa-l" style="color: rgb(89, 73, 222);"></i>   Login Page </h1>
        <br>
  <div class="form-row">
    <div class="form-group col-md-4">
    <label for="name"> Name</label>
    <input type="text" class="form-control" id="name">
  </div>
    <div class="form-group col-md-4">
      <label for="inputEmail4">Email</label>
      <input type="email" class="form-control" id="inputEmail">
    </div>
    <div class="form-group col-md-4">
      <label for="number">Mobile Number</label>
      <input type="tel" class="form-control" id="mobilenumber">
    </div>
  </div>
  <div class="form-group col-md-4">
    <label for="inputAddress">Address</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
  </div>
  <div class="form-group col-md-4">
    <label for="inputAddress2">Address 2</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
  </div>
  <div class="form-row ">
    <div class="form-group col-md-4">
      <label for="inputCity">City</label>
      <input type="text" class="form-control" id="inputCity">
    </div>
    <div class="form-group col-md-4">
      <label for="inputState">State</label>
      <select id="inputState" class="form-control">
        <option selected>Choose...</option>
        <option>Gujarat</option>
        <option>Rajasthan</option>

        <option>Maharashtra</option>
        <option>Delhi</option>
        <option>Uttarakkhand</option>

      </select>
    </div>
    
  </div>
        <br>

 
  <!-- <a href="./profile.html"> -->
    <button  style="margin-left: 130px;" type="button" class="btn btn-primary" onclick="setprofile()">Login</button>
<!-- </a> -->
</form>

<script>
    function setprofile(){
        let name=document.getElementById("name").value;
        let email=document.getElementById("inputEmail").value;
        let mobilenumber=document.getElementById("mobilenumber").value;
        let inputAddress=document.getElementById("inputAddress").value;
        let inputAddress2=document.getElementById("inputAddress2").value;
        let inputCity=document.getElementById("inputCity").value;
        let inputState=document.getElementById("inputState").value;




      localStorage.setItem("name",name);

      localStorage.setItem("email",email);
      localStorage.setItem("mobilenumber",mobilenumber);
      localStorage.setItem("inputAddress2",inputAddress2);
      localStorage.setItem("inputAddress",inputAddress);
      localStorage.setItem("inputCity",inputCity);
      localStorage.setItem("inputState",inputState);







      
      location.href = "profile.html";

    }
</script>
</body>
</html>
