
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container text-center mt-4">

        <img id="productImage" style="max-height: 300px; max-width: 100%;">

        <h1 id="producttitle"></h1>
        <h2 id="productdescription"></h2>
        <h2 id="productprice"></h2>

        <button class="btn btn-primary" onclick="addToCart()">
            Add to Cart
        </button>

    </div>

    <script>
        let savedImage = localStorage.getItem("image");
        let savedtitle = localStorage.getItem("title");
        let saveddescription = localStorage.getItem("description");
        let savedprice = localStorage.getItem("price");

        document.getElementById("productImage").src = savedImage;
        document.getElementById("producttitle").innerHTML = savedtitle;
        document.getElementById("productdescription").innerHTML = saveddescription;
        document.getElementById("productprice").innerHTML = savedprice;

        function addToCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart.push({
                image: savedImage,
                title: savedtitle,
                price: savedprice
            });

            localStorage.setItem("cart", JSON.stringify(cart));


        }
    </script>

</body>
</html>
