<nav class="ccs-pillNav" style="z-index: 10;">
  <a class="ccs-pillItem is-active" href="./i.html" target="_self"><i class="fa-solid fa-house fa-lg" style="color: rgb(0, 0, 0);"></i></a>
  <a class="ccs-pillItem" href="./wishlist.html" target="_self"><i class="fa-solid fa-heart fa-lg" style="color: rgb(0, 0, 0);"></i></a>

    <div class="container text-center mt-4" id="i">

        <img id="productImage" style="max-height: 300px; max-width: 100%;">

        <h1 id="producttitle"></h1>
        <h2 id="productdescription"></h2>
        <h2 id="productprice"></h2>

        <button class="btn btn-primary" onclick="addToWishlist()">
Wishlist
        </button>
        <button class="btn btn-primary" onclick="addToCart()">
            Add to Cart
        </button>

    </div>

    <script>
        let savedImage = localStorage.getItem("image");
        let savedtitle = localStorage.getItem("title");
        let saveddescription = localStorage.getItem("description");
        let savedprice = localStorage.getItem("price");

        document.getElementById("productImage").src = savedImage;
        document.getElementById("producttitle").innerHTML = savedtitle;
        document.getElementById("productdescription").innerHTML = saveddescription;
        document.getElementById("productprice").innerHTML = savedprice;

        function addToCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart.push({
                image: savedImage,
                title: savedtitle,
                price: savedprice,
                description: saveddescription,
            });

            localStorage.setItem("cart", JSON.stringify(cart));


        }
        function addToWishlist() {
            let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

            wishlist.push({
                image: savedImage,
                title: savedtitle,
                price: savedprice,
                description: saveddescription,

            });

            localStorage.setItem("wishlist", JSON.stringify(wishlist));


        }
    </script>
