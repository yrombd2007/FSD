<nav class="ccs-pillNav" style="z-index: 10;">
  <a class="ccs-pillItem is-active" href="./i.html" target="_self"><i class="fa-solid fa-house fa-lg" style="color: rgb(0, 0, 0);"></i></a>
  <a class="ccs-pillItem" href="./wishlist.html" target="_self"><i class="fa-solid fa-heart fa-lg" style="color: rgb(0, 0, 0);"></i></a>
  <a class="ccs-pillItem" href="./cart.html" target="_self"><i class="fa-solid fa-cart-shopping fa-lg" style="color: rgb(0, 0, 0);"></i></a>
  <a class="ccs-pillItem" href="./profile.html" target="_self"><i class="fa-solid fa-user fa-lg" style="color: rgb(0, 0, 0);"></i></a>

    <div class="container mt-4">
      <div style="margin-top: 60px; font-size: 4ch;">
             My Cart
      </div>
        <br>


        <div id="cartItems" style="margin-top: 10px;" class="d-flex flex-wrap gap-3"></div>
<div id="placeorder"></div>
<div id="payment"></div>

    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let display = document.getElementById("cartItems");
        let placeorder=document.getElementById("placeorder");
        let payment=document.getElementById("payment");
        let totalamount = 0;
function showCart() {
    display.innerHTML = "";

    cart.forEach(function(product, i) {
        display.innerHTML += `
            <div class="card p-3" style="width: 50rem;">
                <img src="${product.image}"
                     style="height: 180px; object-fit: contain;">

                <h5 class="mt-3">${product.title}</h5>
 <h5 class="mt-3">${product.description}</h5>

                <h6>Price: $${product.price}</h6>

               <a href="./cart.html" <button class="btn btn-danger" onclick="del(${i})">
                    Delete
                </button></a>
            </div>
        `;
    });
}

function del(i) {
    cart.splice(i, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
showCart();
checkCart();


}

function checkCart(product) {
    if (cart.length > 0) {
      let total=0;
      cart.forEach(function(product){
        total=total+Number(product.price);
        platformfee=10;
        discount=total%10;

        totalamount=total+platformfee-discount;
      });

        placeorder.innerHTML = `
       <div class="bill"><h2 class="mrp">Total MRP : $${total.toFixed(2)}<h2>
        <h2 class="discount">Discount : -$${discount.toFixed(2)}<h2>
          <h2 class="platformfee"> Platform fee : $10</h2>
        <h2 class="totalamount">Total Amount : $${totalamount.toFixed(2)}<h2>


            <div class="btn btn-success" onclick="pay()">Place Order</div>
            </div> 
        `;
      
    }
    else {
        placeorder.innerHTML = `<div class=empty"> <div id="empty">Your Cart is Empty</div>
           <a href="./wishlist.html" <div class="btn btn-success" id="empty2">Add Items from Wishlist</div></a>
</div>
        
        `;
    }
  }
   function pay() {
    payment.innerHTML = `
        <div class="scanner">
            <img src="./images/Screenshot 2026-10-14 at 2.05.28 PM.png"
                 style="width: 200px; height: 200px;">
        </div>

        <h2 class="paymentamount">
            Pay: $${totalamount.toFixed(2)}
        </h2>
    `;
}
  

showCart();
checkCart();
    </script>
